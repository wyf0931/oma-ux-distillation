$schema: https://json-schema.org/draft/2020-12/schema
title: UX Page Map
description: Static page evidence and candidate controls for future interaction research; not an interaction observation.
type: object
required:
  - record_type
  - site
  - page
  - visible_structure
  - interaction_candidates
  - limits
  - evidence
properties:
  record_type:
    const: page_map
  site:
    type: string
    description: Stable product or site name matching its corpus entry.
  page:
    type: string
    description: Page or flow mapped; this record does not claim an interaction response.
  visible_structure:
    type: array
    description: Directly visible regions and controls, without inferring their behavior.
    items: { type: string }
  interaction_candidates:
    type: array
    description: Possible actions to test later, stated as questions or unverified paths.
    items: { type: string }
  limits:
    type: array
    description: What could not be established or was not tested during the page capture.
    items: { type: string }
  related_observations:
    type: array
    description: Optional repository-relative links to tested interactions from this page.
    items: { type: string }
  evidence:
    type: array
    minItems: 1
    description: Page-level evidence only; page maps do not count as interaction observations or pattern support.
    items:
      type: object
      required:
        - evidence_class
        - url
        - captured_at
        - tool
      properties:
        evidence_class:
          const: page-evidence
          description: Marks static page evidence, not a tested interaction.
        url:
          type: string
          format: uri
          description: Exact URL inspected for the page map.
        page_title:
          type: string
          description: Page title at capture time, or unknown.
        viewport:
          type: string
          description: Browser viewport dimensions and relevant emulation state, or unknown.
        browser:
          type: string
          description: Browser name and version when available, or unknown.
        captured_at:
          type: string
          format: date
          description: Date the page state was captured.
        tool:
          type: string
          description: Browser tool used to inspect the page.
      additionalProperties: true
additionalProperties: true
